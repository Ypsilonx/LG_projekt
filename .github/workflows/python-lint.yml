name: Python Lint & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Lint závislosti jsou minimální – flake8 nepotřebuje thinqconnect/awscrt
    - name: Install lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint – syntax errors & undefined names (hard fail)
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint – style warnings (soft, exit-zero)
      run: |
        flake8 src/ --count --exit-zero --statistics

    - name: Check UTF-8 encoding headers
      run: |
        echo "Checking UTF-8 encoding headers..."
        grep -rl "# -*- coding: utf-8 -*-" src/ | wc -l
        grep -rL "# -*- coding: utf-8 -*-" src/*.py src/**/*.py || true
